name: unit

# À chaque envoi : syntaxe PHP (versions extrêmes déclarées), tests unitaires (API publique OCP, sans serveur), construction de
# l'interface depuis les dépendances verrouillées. La qualification sur de vrais serveurs Nextcloud reste dans nextcloud-app.yml.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - name: Syntaxe PHP
        run: find appinfo lib templates tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Dépendances de développement
        run: composer install --no-interaction --no-progress --ignore-platform-req=php
      - name: Tests unitaires
        run: vendor/bin/phpunit -c phpunit-unit.xml

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Construction depuis les dépendances verrouillées
        run: npm ci && npm run build
      - name: Actifs livrés à jour
        run: |
          git diff --stat --exit-code -- js css || (echo "js/ ou css/ ne correspondent pas aux sources ; relancez npm run build" && exit 1)
